<div class="container mt-5">
  <div class="row">
    <div class="col-md-6 offset-md-3">
      <h2 class="text-center mb-4">Sign Up</h2>
      
      <div *ngIf="formError" class="alert alert-danger">{{ formError }}</div>
      <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
      
      <form (ngSubmit)="onRegisterSubmit()">
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" [(ngModel)]="credentials.name" name="name" required>
        </div>
        
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="credentials.email" name="email" required>
        </div>
        
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" [(ngModel)]="credentials.password" name="password" required>
        </div>
        
        <div class="mb-3">
          <label class="form-label">Re-type Password</label>
          <input type="password" class="form-control" [(ngModel)]="credentials.confirmPassword" name="confirmPassword" required>
        </div>
        
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" [(ngModel)]="agreeTerms" name="agreeTerms">
          <label class="form-check-label">
            I agree to the <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>
          </label>
        </div>
        
        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
        <a routerLink="/login" class="btn btn-link w-100 mt-2">Already have an account? Log In</a>
        <a href="#" class="btn btn-link w-100">Learn More</a>
      </form>
    </div>
  </div>
</div>
